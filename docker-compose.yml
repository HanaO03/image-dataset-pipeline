# =============================================================================
#  `docker compose up` runs the whole thing: a clean database, the pipeline
#  end to end, results in ./data/output. Then the pipeline container exits 0
#  and Postgres stays up so the results can be queried.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: imagepipeline-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imagedb}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      # Page-level checksums, so silent storage corruption is detected on read
      # rather than surfacing later as an inexplicable data bug. Costs a few
      # percent of write throughput, which is irrelevant at this volume, and it
      # can only be enabled at initdb time — hence here and not in a config file.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Exposed so a reviewer can connect with psql or a GUI and inspect the
      # tables directly. 5433 on the host avoids clashing with a local Postgres.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` with the real user and database — the bare form reports
      # ready while the target database is still being created.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeline} -d ${POSTGRES_DB:-imagedb}"]
      interval: 3s
      timeout: 5s
      retries: 20
      # Gives initdb time to finish on a cold volume before the first probe
      # counts against the retry budget.
      start_period: 10s
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit, because the Dockerfile has a later `test` stage. Without it
      # this service would build that stage and ship pytest to production.
      target: runtime
    container_name: imagepipeline-app
    depends_on:
      postgres:
        # Wait for the healthcheck, not merely for the container to start.
        # `depends_on` alone only guarantees creation order, which is the
        # single most common cause of "connection refused" on first run.
        # The application *also* retries — see db/connection.py — because a
        # healthcheck narrows the race but does not eliminate it.
        condition: service_healthy
    # Everything in .env reaches the application, not only the handful of
    # variables listed below.
    #
    # Without this, compose reads .env purely for its own ${VAR} substitution
    # and the container never sees the rest — so editing SPLIT_TRAIN_PERCENT or
    # DEDUPE_MAX_HAMMING_DISTANCE there changes nothing at all, silently. That
    # is the worst kind of configuration bug: the file says one thing, the run
    # does another, and nothing anywhere disagrees out loud.
    #
    # `required: false` keeps `docker compose up` working for someone who never
    # copied .env.example — the defaults in src/config.py are complete on their own.
    env_file:
      - path: .env
        required: false
    environment:
      # These are set explicitly because they must be true inside the container
      # regardless of what .env says — .env is also read by a developer running
      # the pipeline outside Docker, where the host and port differ.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-imagedb}
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      PATH_DATA_DIR: /data
      # Run lineage. The built image deliberately carries no .git directory, so
      # the in-process `git rev-parse` fallback cannot work there — without this
      # line `pipeline_runs.git_commit` would be NULL on exactly the path the
      # README tells people to use, and "which code produced this dataset?"
      # would have no answer. `make up` fills it in; a bare `docker compose up`
      # leaves it empty rather than failing, which is the right trade.
      GIT_COMMIT: ${GIT_COMMIT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      SOURCE_TARGET_PER_CLASS: ${SOURCE_TARGET_PER_CLASS:-60}
      SOURCE_MIN_PER_CLASS: ${SOURCE_MIN_PER_CLASS:-40}
      # Optional: raises the Openverse rate limit. Anonymous access is the
      # default and works without these.
      SOURCE_OPENVERSE_CLIENT_ID: ${SOURCE_OPENVERSE_CLIENT_ID:-}
      SOURCE_OPENVERSE_CLIENT_SECRET: ${SOURCE_OPENVERSE_CLIENT_SECRET:-}
    volumes:
      # Bind mount, not a named volume: the deliverable is the contents of
      # ./data/output on the reviewer's own machine. A named volume would hide
      # the results inside Docker where they are awkward to reach.
      - ./data:/data
    # A batch job, not a service. Without this, a non-zero exit — which is
    # exactly what the quality gate produces — would send compose into a
    # restart loop that re-runs the entire pipeline.
    restart: "no"

  # The full test suite, including the integration tests that need a real
  # Postgres. Behind a profile so `docker compose up` never starts it.
  #
  #     docker compose --profile test run --rm tests     (or: make test)
  #
  # Running the suite here rather than on the host is what makes "103 tests pass"
  # a claim the reviewer can check in one command instead of a claim that
  # depends on them having Python 3.12 and the right wheels.
  tests:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    profiles: ["test"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The integration suite creates and drops its own throwaway database, so
      # it never touches the pipeline's data.
      TEST_POSTGRES_HOST: postgres
      TEST_POSTGRES_PORT: 5432
      TEST_POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      TEST_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      TEST_POSTGRES_DB: pipeline_itest
      PATH_DATA_DIR: /tmp/testdata
    restart: "no"

volumes:
  pgdata:
