# =============================================================================
#  CI — the same two commands a reviewer would run, run on every push.
#
#  The point is not the green tick. It is that the claims in the README
#  ("160 tests pass", "docker compose up builds") are checked by something
#  other than my word, on a machine that is not mine.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    name: lint + tests
    runs-on: ubuntu-latest

    # The integration suite needs a real Postgres — it creates and drops its
    # own throwaway database, so it never collides with anything else here.
    # Without this service the suite still passes, but it would *skip* the one
    # test that exercises the pipeline end to end, which is the test worth
    # running most.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests scripts

      - name: Tests
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: 5432
          TEST_POSTGRES_USER: postgres
          TEST_POSTGRES_PASSWORD: postgres
          TEST_POSTGRES_DB: pipeline_itest
          # Keep the suite's scratch files out of the working tree.
          PATH_DATA_DIR: /tmp/testdata
        # -rs so a skipped test is reported with its reason rather than as a
        # silent dot: a suite that quietly skips its integration test looks
        # exactly like a suite that passed it.
        run: pytest tests -q -rs

  docker-build:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `docker compose up` is the documented entry point, so the thing that
      # must never break is the build itself. This catches a missing system
      # library or an unpinned dependency before a reviewer does.
      - name: Build runtime image
        run: docker build --target runtime -t image-pipeline:ci .

      - name: Build test image
        run: docker build --target test -t image-pipeline:ci-test .

      - name: Validate compose file
        run: docker compose config --quiet
